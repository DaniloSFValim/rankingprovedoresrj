name: CI

# Garante que o motor de calculo e a exportacao estatica continuam integros.
# Nao publica nada: o deploy e feito pelo workflow Deploy. O build usa os
# artefatos reais versionados em apps/web/public/data.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes
        run: npm test

      - name: Verificacao de tipos do ETL
        run: npx tsc --noEmit -p packages/etl/tsconfig.json

      - name: Build da exportacao estatica
        run: npm run build
