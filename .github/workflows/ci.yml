name: CI

# Garante que o motor de calculo e a exportacao estatica continuam integros.
# Nao publica nada: o deploy e feito pelo Cloudflare Pages a partir de
# apps/web/out/, versionado no repositorio.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes
        run: npm test

      - name: Verificacao de tipos do ETL
        run: npx tsc --noEmit -p packages/etl/tsconfig.json

      # Gera a fixture sintetica para que o build tenha artefatos de dados.
      # Os dados reais da Anatel nao sao baixados na CI.
      - name: Gerar artefatos de desenvolvimento
        run: npm run etl -- demo

      - name: Build da exportacao estatica
        run: npm run build
