name: Ingerir dados reais da Anatel

# Este workflow existe porque a ingestao precisa de duas coisas que o build da
# Cloudflare nao tem: acesso de rede a *.gov.br e permissao para compilar
# modulos nativos (better-sqlite3). O runner do GitHub tem as duas.
#
# Ele baixa os dados da Anatel, baixa a malha municipal do IBGE, reconstroi os
# artefatos e o site, e commita os artefatos. O workflow Deploy publica em
# seguida (gatilho workflow_run).

on:
  # Execucao manual, com os parametros expostos.
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Fonte dos dados'
        type: choice
        required: false
        default: anatel
        options:
          - anatel
          - basedosdados
      anos:
        description: 'Quantos anos mais recentes importar (safras anteriores sao puladas)'
        required: false
        default: '5'
      url:
        description: 'URL de um recurso especifico (ignora a descoberta automatica)'
        required: false
        default: ''
      malhas:
        description: 'Baixar tambem a malha municipal do IBGE'
        type: boolean
        required: false
        default: true

  # Dia 12 de cada mes, as 09:00 UTC. A Anatel costuma publicar a competencia
  # do mes anterior ao longo do mes seguinte; o dia 12 e uma aposta
  # conservadora, e a execucao e idempotente se o dado ainda nao mudou.
  schedule:
    - cron: '0 9 12 * *'

# Necessario para commitar os artefatos de volta.
permissions:
  contents: write

# Duas execucoes simultaneas commitariam por cima uma da outra.
concurrency:
  group: ingestao-dados
  cancel-in-progress: false

jobs:
  ingerir:
    runs-on: ubuntu-latest
    # Baixar e processar arquivos anuais da Anatel leva tempo.
    timeout-minutes: 120

    steps:
      # Os arquivos anuais da Anatel passam de 1 GB e, descompactados, chegam
      # a varios GB. O runner vem com toolchains pre-instalados que nao usamos
      # e que ocupam dezenas de GB; remove-los evita "no space left on device"
      # no meio da descompactacao.
      - name: Liberar espaco em disco
        if: inputs.fonte != 'basedosdados'
        run: |
          echo "Antes:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Depois:"; df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar o motor de calculo antes de tocar nos dados
        run: npm test

      # ------------------------------------------------- Base dos Dados (BigQuery)
      # Caminho preferencial. A descoberta no portal da Anatel se mostrou
      # inviavel: a API do dados.gov.br exige chave de Administrador de
      # Organizacao e o inventario publico raramente traz link direto.
      - name: Schema da Base dos Dados (diagnostico)
        if: inputs.fonte == 'basedosdados'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npm run etl -- bdd-inspecionar

      - name: Importar dados do RJ via BigQuery
        if: inputs.fonte == 'basedosdados'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npm run etl -- bdd-importar --anos "${{ inputs.anos || '2' }}"

      # --------------------------------------------------- Anatel (alternativa)
      # Sondagem antes de tudo: testa por HEAD os enderecos candidatos e relata
      # quais existem de fato. Deduzir URL e chute; confirmar com o servidor e
      # evidencia.
      - name: Sondar enderecos de arquivo da Anatel
        if: inputs.fonte != 'basedosdados'
        continue-on-error: true
        run: npm run etl -- sondar ${{ inputs.url }}

      - name: Inventario de bases da Anatel (diagnostico)
        if: inputs.fonte != 'basedosdados'
        continue-on-error: true
        run: npm run etl -- inventario

      - name: Inspecionar o catalogo de dados abertos
        if: inputs.fonte != 'basedosdados'
        continue-on-error: true
        env:
          # Opcional. A API do dados.gov.br responde 401 sem chave; sem ela a
          # descoberta usa apenas o inventario da Anatel, que e aberto.
          DADOS_GOV_BR_API_KEY: ${{ secrets.DADOS_GOV_BR_API_KEY }}
        run: npm run etl -- descobrir

      - name: Importar recurso especifico
        if: inputs.fonte != 'basedosdados' && inputs.url != ''
        run: npm run etl -- atualizar "${{ inputs.url }}"

      - name: Sincronizar automaticamente
        if: inputs.fonte != 'basedosdados' && inputs.url == ''
        env:
          DADOS_GOV_BR_API_KEY: ${{ secrets.DADOS_GOV_BR_API_KEY }}
        run: npm run etl -- sincronizar --anos "${{ inputs.anos || '2' }}"

      # --------------------------------------------------------------- IBGE
      # A Base dos Dados entrega apenas o codigo do municipio. Sem os nomes
      # oficiais, as paginas municipais exibiriam numeros.
      - name: Nomes oficiais dos municipios (IBGE)
        continue-on-error: true
        run: npm run etl -- municipios

      # A malha e opcional: se o IBGE estiver fora do ar, o mapa continua
      # funcionando como treemap e o resto da atualizacao nao e perdido.
      - name: Baixar a malha municipal do IBGE
        # Sempre roda no agendamento; na execucao manual, so se marcado.
        if: github.event_name != 'workflow_dispatch' || inputs.malhas
        continue-on-error: true
        run: npm run etl -- malhas

      - name: Relatorio de qualidade
        run: npm run etl -- status

      # Situacao cadastral, abertura e porte das prestadoras (BrasilAPI, dados
      # abertos do CNPJ). Opcional: se a API falhar, o cadastro anterior fica.
      - name: Cadastro das prestadoras na Receita Federal
        continue-on-error: true
        run: npm run etl -- receita

      # --------------------------------------------------------------- build
      - name: Reconstruir artefatos e site
        env:
          NETRANK_AMBIENTE: producao
        run: |
          npm run etl -- build
          npm run build

      - name: Conferir que nao ha dados demonstrativos publicados
        run: |
          if grep -q '"dadosDemonstrativos":true' apps/web/public/data/meta.json; then
            echo "::error::Os artefatos estao marcados como DEMONSTRATIVOS. Abortando."
            exit 1
          fi
          echo "Artefatos marcados como dados reais."

      - name: Commitar e publicar
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/data data/receita
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos dados. Nada a publicar."
            exit 0
          fi
          COMPETENCIA=$(node -p "require('./apps/web/public/data/meta.json').competenciaAtual")
          git commit -m "Atualiza dados da Anatel - competencia ${COMPETENCIA}" \
                     -m "Gerado pelo workflow de ingestao. Fonte: Anatel, dados abertos. Malha municipal: IBGE."
          # Outro push pode ter entrado enquanto o processamento rodava.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
