name: Sondar colunas da Anatel (temporario)
on:
  pull_request:
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: SIDRA - domicilios Censo 2022 (tabela 4712)
        run: |
          curl -sS "https://apisidra.ibge.gov.br/values/t/4712/n6/in%20n3%2033/v/all/p/all" -o /tmp/d.json; head -c 1500 /tmp/d.json; echo
          python3 -c "
          import json; d=json.load(open('/tmp/d.json')); h=d[0]; print(h)
          vs={}
          for x in d[1:]: vs.setdefault(x['D2N'],[]).append(x)
          for k,v in vs.items(): print(k, len(v), [ (x['D1N'],x['V']) for x in v if x['D1N'].startswith(('Rio de Janeiro','Itaboraí','Niterói','Engenheiro'))])
          "
      - name: SIDRA - populacao Censo 2022 (tabela 4709)
        run: |
          curl -sS "https://apisidra.ibge.gov.br/values/t/4709/n6/in%20n3%2033/v/93/p/all" -o /tmp/p.json; head -c 600 /tmp/p.json; echo
          python3 -c "
          import json; d=json.load(open('/tmp/p.json')); print(len(d)-1, [ (x['D1N'],x['V']) for x in d[1:] if x['D1N'].startswith(('Rio de Janeiro','Itaboraí'))])
          "
