name: Segurança

# Auditoria de dependências e análise estática de código. Roda em push e pull
# request para main e diariamente, para pegar vulnerabilidades publicadas
# depois do último commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  auditoria:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Falha com vulnerabilidade alta ou crítica; moderadas e baixas aparecem
      # no relatório sem bloquear.
      - name: npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analisar
        uses: github/codeql-action/analyze@v3
