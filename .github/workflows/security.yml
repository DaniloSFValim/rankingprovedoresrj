name: Security & Vulnerability Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Executar scanning diário às 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  security-audit:
    name: Dependency & Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit Security Check
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npm audit --json > audit-report.json
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

      - name: Comment on PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));

            if (audit.metadata && audit.metadata.vulnerabilities.total > 0) {
              const message = `⚠️ **Security Audit Results**\n\n` +
                `- Critical: ${audit.metadata.vulnerabilities.critical}\n` +
                `- High: ${audit.metadata.vulnerabilities.high}\n` +
                `- Moderate: ${audit.metadata.vulnerabilities.moderate}\n` +
                `- Low: ${audit.metadata.vulnerabilities.low}`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }

  dependency-check:
    name: Outdated Dependencies Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check outdated packages
        run: npm outdated --json > outdated.json || true

      - name: Report outdated dependencies
        run: |
          if [ -s outdated.json ]; then
            echo "⚠️ Some dependencies have newer versions:"
            npm outdated
          fi
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency tree check
        run: npm list --depth=10

      - name: Verify no duplicate dependencies
        run: |
          npm list 2>&1 | grep -E "npm ERR|npm WARN" || echo "✓ No dependency issues found"

  results:
    name: Security Summary
    needs: [security-audit, dependency-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.security-audit.result }}" = "failure" ] || [ "${{ needs.dependency-check.result }}" = "failure" ]; then
            echo "⚠️ Security checks revealed issues. Review the logs above."
            exit 1
          else
            echo "✓ All security checks passed"
          fi
        continue-on-error: true
